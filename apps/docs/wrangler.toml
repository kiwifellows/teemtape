# teemtape docs — Cloudflare Worker serving the static Astro/Starlight build.
#
# Deployed automatically by Workers Builds (git integration) on push to main.
# Manual deploy: npm run deploy --workspace docs
#
# Workers Builds settings (dashboard → Workers & Pages → teemtape-docs → Settings → Build):
#   Root directory:  apps/docs
#   Build command:   npm run build
#   Deploy command:  npx wrangler deploy

name = "teemtape-docs"
compatibility_date = "2024-12-10"

[assets]
directory = "./dist"
not_found_handling = "404-page"
