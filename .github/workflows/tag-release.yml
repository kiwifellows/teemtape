name: Tag and release

# Phase 2 of the release process.
#
# Runs after a release PR (opened by .github/workflows/release.yml) is merged
# into `main`. It detects the freshly bumped version, then:
#
#   1. Creates the annotated tag `v<version>` on `main`. Tags live in
#      refs/tags/* and are NOT subject to branch protection rules, so this works
#      even though `main` only accepts changes via pull request.
#   2. Cuts a downloadable GitHub release for that tag.
#   3. Publishes @teemtape/api-client and @teemtape/cli to npm (with provenance),
#      api-client first because the CLI depends on it.
#
# The release is keyed off the @teemtape/cli package version. The tag and the
# GitHub release are cut when `v<version>` does not exist yet; the npm publish
# runs whenever npm lacks that version of either package. So a merge that does
# not bump the version is a no-op (tag exists, npm is current), while "Re-run
# failed jobs" on a run that died at the npm step picks up where it stopped:
# tag and release are left alone and only the missing package(s) are published.
#
# npm auth is npm Trusted Publishing (OIDC): no token secret. Each package on
# npmjs.com must list this repo + `tag-release.yml` (+ environment `release`) as
# a trusted publisher under Package settings → Trusted Publisher. npm's
# long-lived automation tokens can no longer publish, which is why the old
# NPM_PACKAGE_TOKEN path was dropped.
#
# Older tags: the manual `tag` input publishes any existing tag that npm is
# missing (checks the tag out, builds, publishes what is absent), for versions
# whose original run is too old to re-run.

on:
  push:
    branches:
      - main
    paths:
      - "packages/cli/package.json"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to npm, e.g. v1.0.0. Publishes whichever packages npm lacks; never re-tags."
        type: string
        required: true

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    name: Tag, release, and publish to npm
    # Optional manual approval gate. Configure the `release` environment under
    # Settings → Environments and add "Required reviewers": the job will then
    # pause after the release PR merges and wait for a human to approve before it
    # tags, cuts the GitHub release, and publishes to npm. With no reviewers
    # configured the environment is inert and the job runs straight through.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"
          scope: "@teemtape"

      - name: Determine release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          TAG="v$VERSION"

          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "$TAG" ]; then
            # Manual run: the checkout already failed if the tag does not exist;
            # guard against a tag whose package.json disagrees with its name.
            echo "::error::Tag $INPUT_TAG contains @teemtape/cli version $VERSION (expected ${INPUT_TAG#v})."
            exit 1
          fi

          # Cut the tag + GitHub release only when the tag is new.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            CUT=false
          else
            CUT=true
          fi

          # Publish when npm lacks this version of either package. Decided
          # here (not just by the tag) so a re-run after a failed npm step still
          # publishes; scripts/npm-publish.sh skips each package npm already has.
          PUBLISH=$CUT
          for PKG in @teemtape/api-client @teemtape/cli; do
            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              echo "$PKG@$VERSION is on npm."
            else
              echo "$PKG@$VERSION is not on npm yet."
              PUBLISH=true
            fi
          done

          if [ "$CUT" = true ]; then
            echo "New version detected: $VERSION (tag $TAG)"
          elif [ "$PUBLISH" = true ]; then
            echo "Tag $TAG already exists — publishing what npm is missing from that tag."
            # `main` may have moved on since the tag was cut; publish the
            # tagged source, not whatever main is now.
            git checkout -q "$TAG"
          else
            echo "Tag $TAG already exists and npm is current — nothing to release."
          fi

          echo "cut=$CUT" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: npm ci

      - name: Build publishable packages
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          npm run build --workspace @teemtape/api-client
          npm run build --workspace @teemtape/cli

      - name: Test publishable packages
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          npm run test --workspace @teemtape/api-client --if-present
          npm run test --workspace @teemtape/cli --if-present

      - name: Create and push tag
        if: ${{ steps.version.outputs.cut == 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"

      - name: Extract release notes from CHANGELOG.md
        if: ${{ steps.version.outputs.cut == 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG" '
              $0 ~ "^## \\[" tag "\\]" { capture=1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > /tmp/release-notes.md || true
          fi
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for $TAG — GitHub will auto-generate notes."
          fi

      - name: Create GitHub release
        if: ${{ steps.version.outputs.cut == 'true' }}
        env:
          # Prefer a PAT (RELEASE_TOKEN) so the published-release event can trigger
          # any downstream release-event workflows. Falls back to the default
          # token, which still creates the release.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -s /tmp/release-notes.md ]; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target main \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target main \
              --title "$TAG" \
              --generate-notes
          fi

      # No NODE_AUTH_TOKEN on the publish steps: npm ≥ 11.5.1 sees the
      # `id-token: write` OIDC credential and exchanges it with npmjs.com
      # (trusted publishing). A leftover token env would be used instead and
      # break the exchange, so keep these steps token-free.
      - name: Publish @teemtape/api-client to npm
        if: ${{ steps.version.outputs.publish == 'true' }}
        env:
          PKG: "@teemtape/api-client"
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/npm-publish.sh

      - name: Publish @teemtape/cli to npm
        if: ${{ steps.version.outputs.publish == 'true' }}
        env:
          PKG: "@teemtape/cli"
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/npm-publish.sh

      - name: Notify teemtape-pro of the release
        # The private Pro repo listens for this (repository_dispatch
        # "teemtape-released") and re-runs its tests against the new client.
        # Needs PRO_DISPATCH_TOKEN: a fine-grained PAT for kiwifellows/teemtape-pro
        # with Actions: read & write. Skipped silently when it is not set.
        if: ${{ steps.version.outputs.publish == 'true' }}
        env:
          PRO_DISPATCH_TOKEN: ${{ secrets.PRO_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$PRO_DISPATCH_TOKEN" ]; then
            echo "PRO_DISPATCH_TOKEN not set — skipping teemtape-pro notification."
            exit 0
          fi
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PRO_DISPATCH_TOKEN" \
            https://api.github.com/repos/kiwifellows/teemtape-pro/dispatches \
            -d "{\"event_type\":\"teemtape-released\",\"client_payload\":{\"version\":\"$VERSION\"}}"

      - name: Summary
        if: ${{ steps.version.outputs.publish == 'true' }}
        run: |
          {
            echo "### Released ${{ steps.version.outputs.tag }}"
            echo
            echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
            if [ "${{ steps.version.outputs.cut }}" = "true" ]; then
              echo "- GitHub release: downloadable from the Releases page"
            else
              echo "- GitHub release: already existed (re-publish)"
            fi
            echo "- Published: \`@teemtape/api-client\`, \`@teemtape/cli\`"
          } >> "$GITHUB_STEP_SUMMARY"
